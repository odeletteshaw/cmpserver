[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmp-mock-tester"
version = "0.1.1"
description = "A field-level mocking CMP (RFC 4210) CA simulator for negative-testing certificate protocols."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "odele" }]
keywords = ["CMP", "RFC 4210", "PKI", "CA", "ASN.1", "certificate", "negative testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
]
dependencies = [
    "asn1crypto>=1.5.1",
    "oscrypto>=1.3.0",
    "certbuilder>=0.14.2",
]

[project.urls]
Homepage = "https://github.com/odeletteshaw/cmp_mock_tester"
Source = "https://github.com/odeletteshaw/cmp_mock_tester"

[tool.setuptools.packages.find]
include = ["cmp_mock_tester*"]
